name: Production Release & Deploy

on:
  release:
    types: [published]
  repository_dispatch:
    types: [deploy-reviews]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Auditar y Validar Build (Vite)
        run: npm run build

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Artifacts para Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Desplegar a Producción (Vercel)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Manejo de Fallos (Halt & Issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const isRelease = context.eventName === 'release';
            const releaseTag = isRelease && context.payload.release ? context.payload.release.tag_name : 'N/A';
            const issueTitle = `🚨 Error Crítico de Despliegue: ${isRelease ? 'Release ' + releaseTag : 'Actualización de Reseñas'}`;
            const issueBody = `El pipeline de despliegue automatizado ha fallado en el paso de Build o Deploy.

            **Detalles:**
            - **Evento:** ${context.eventName}
            - **Autor:** ${context.actor}
            - **Logs de Ejecución:** [Ver Logs en Actions](${runUrl})

            *Este issue fue generado automáticamente por la estrategia Halt & Issue.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['bug', 'automated-alert']
            });