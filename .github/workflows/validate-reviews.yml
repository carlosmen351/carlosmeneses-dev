name: Validate Reviews

on:
  schedule:
  - cron: '0 0 * * *'
    # Permite ejecución manual desde GitHub
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Agent Validation
        env:
          # PAT fine-grained limitado a feedback, con Issues: read/write.
          GITHUB_TOKEN: ${{ secrets.PAT_FEEDBACK }} 
          # Deploy Hook de Vercel
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          # API Key para validación con Inteligencia Artificial
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/validate-reviews.mjs
