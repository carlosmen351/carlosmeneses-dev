<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="675" fill="url(#bgGradient)"/>
  
  <!-- Header -->
  <rect width="1200" height="80" fill="#0D1117" opacity="0.8"/>
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#30363D" stroke-width="1"/>
  
  <text x="60" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#58A6FF">
    📱 Calculadora Financiera
  </text>
  
  <!-- Tabs Section -->
  <rect x="40" y="120" width="1120" height="50" fill="none"/>
  
  <!-- Tab 1: Ahorro (Active) -->
  <rect x="60" y="125" width="120" height="40" fill="#58A6FF" rx="4"/>
  <text x="75" y="152" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0D1117">
    💰 Ahorro
  </text>
  
  <!-- Tab 2: Inversión -->
  <rect x="200" y="130" width="120" height="30" fill="none" stroke="#30363D" stroke-width="1" rx="4"/>
  <text x="215" y="152" font-family="Arial, sans-serif" font-size="13" fill="#E6EDF3">
    📈 Inversión
  </text>
  
  <!-- Tab 3: Presupuesto -->
  <rect x="340" y="130" width="120" height="30" fill="none" stroke="#30363D" stroke-width="1" rx="4"/>
  <text x="350" y="152" font-family="Arial, sans-serif" font-size="13" fill="#E6EDF3">
    📊 Presupuesto
  </text>
  
  <!-- Theme Toggle Button -->
  <rect x="1000" y="125" width="140" height="40" fill="#30363D" rx="4"/>
  <text x="1020" y="152" font-family="Arial, sans-serif" font-size="13" fill="#58A6FF">
    🌙 Tema Oscuro
  </text>
  
  <!-- Calculator Card Section -->
  <!-- Main Card -->
  <rect x="40" y="200" width="1120" height="440" fill="rgba(30, 30, 38, 0.6)" stroke="#30363D" stroke-width="1" rx="12"/>
  
  <!-- Form Grid (3 inputs) -->
  
  <!-- Label 1 -->
  <text x="80" y="235" font-family="Arial, sans-serif" font-size="12" fill="#E6EDF3" font-weight="bold">
    Monto Inicial ($)
  </text>
  
  <!-- Input Field 1 -->
  <rect x="80" y="245" width="300" height="38" fill="#30363D" stroke="#30363D" stroke-width="1" rx="6"/>
  <text x="100" y="271" font-family="Arial, sans-serif" font-size="14" fill="#8B949E">
    10000
  </text>
  
  <!-- Label 2 -->
  <text x="420" y="235" font-family="Arial, sans-serif" font-size="12" fill="#E6EDF3" font-weight="bold">
    Tasa de Interés (%)
  </text>
  
  <!-- Input Field 2 -->
  <rect x="420" y="245" width="300" height="38" fill="#30363D" stroke="#30363D" stroke-width="1" rx="6"/>
  <text x="440" y="271" font-family="Arial, sans-serif" font-size="14" fill="#8B949E">
    5
  </text>
  
  <!-- Label 3 -->
  <text x="760" y="235" font-family="Arial, sans-serif" font-size="12" fill="#E6EDF3" font-weight="bold">
    Período (meses)
  </text>
  
  <!-- Input Field 3 -->
  <rect x="760" y="245" width="300" height="38" fill="#30363D" stroke="#30363D" stroke-width="1" rx="6"/>
  <text x="780" y="271" font-family="Arial, sans-serif" font-size="14" fill="#8B949E">
    12
  </text>
  
  <!-- Button Group -->
  <!-- Calculate Button -->
  <defs>
    <linearGradient id="btnGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58A6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect x="80" y="320" width="350" height="45" fill="url(#btnGradient)" rx="6"/>
  <text x="200" y="351" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Calcular
  </text>
  
  <!-- Clear Button -->
  <rect x="460" y="320" width="350" height="45" fill="#30363D" stroke="#30363D" stroke-width="1" rx="6"/>
  <text x="570" y="351" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#58A6FF">
    Limpiar
  </text>
  
  <!-- Result Box -->
  <defs>
    <linearGradient id="resultGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(57, 211, 159, 0.1);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(88, 166, 255, 0.1);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect x="80" y="400" width="730" height="210" fill="url(#resultGradient)" stroke="#39D39F" stroke-width="2" rx="8"/>
  
  <!-- Result Label -->
  <text x="110" y="430" font-family="Arial, sans-serif" font-size="11" fill="#8B949E" font-weight="bold">
    MONTO TOTAL CON INTERESES
  </text>
  
  <!-- Result Value -->
  <text x="110" y="490" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#39D39F">
    $10,500.00
  </text>
  
  <!-- Features List -->
  <text x="860" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#39D39F">
    ✨ Características:
  </text>
  
  <text x="860" y="265" font-family="Arial, sans-serif" font-size="12" fill="#E6EDF3">
    ✓ 3 Calculadoras integradas
  </text>
  <text x="860" y="290" font-family="Arial, sans-serif" font-size="12" fill="#E6EDF3">
    ✓ Tema oscuro/claro
  </text>
  <text x="860" y="315" font-family="Arial, sans-serif" font-size="12" fill="#E6EDF3">
    ✓ Animaciones fluidas
  </text>
  <text x="860" y="340" font-family="Arial, sans-serif" font-size="12" fill="#E6EDF3">
    ✓ Responsive design
  </text>
  <text x="860" y="365" font-family="Arial, sans-serif" font-size="12" fill="#E6EDF3">
    ✓ Tests incluidos
  </text>
  <text x="860" y="390" font-family="Arial, sans-serif" font-size="12" fill="#E6EDF3">
    ✓ Vite + JavaScript
  </text>
  
  <!-- Tech Stack Badge -->
  <rect x="860" y="430" width="200" height="140" fill="rgba(30, 30, 38, 0.8)" stroke="#30363D" stroke-width="1" rx="6"/>
  
  <text x="880" y="455" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#58A6FF">
    Tech Stack:
  </text>
  
  <text x="880" y="480" font-family="Arial, sans-serif" font-size="10" fill="#E6EDF3">
    • Vanilla JavaScript
  </text>
  <text x="880" y="498" font-family="Arial, sans-serif" font-size="10" fill="#E6EDF3">
    • Vite 5.0
  </text>
  <text x="880" y="516" font-family="Arial, sans-serif" font-size="10" fill="#E6EDF3">
    • CSS3 + PostCSS
  </text>
  <text x="880" y="534" font-family="Arial, sans-serif" font-size="10" fill="#E6EDF3">
    • Mocha + Chai
  </text>
  
  <!-- Footer Badge -->
  <rect x="40" y="650" width="1120" height="20" fill="#39D39F" opacity="0.2" rx="4"/>
  <text x="60" y="664" font-family="Arial, sans-serif" font-size="11" fill="#39D39F" font-weight="bold">
    🚀 Calculadora Financiera - Herramienta para presupuestos e inversión | Deployada en Vercel
  </text>
</svg>
