<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Página no encontrada | Carlos Meneses</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #f6f8fa; color: #0d1117; }
      @media (prefers-color-scheme: dark) { :root { background: #0d1117; color: #e6edf3; } }
      body { box-sizing: border-box; display: grid; min-height: 100vh; margin: 0; padding: 2rem; place-items: center; }
      main { max-width: 38rem; text-align: center; }
      p:first-child { color: #0550ae; font-weight: 700; }
      @media (prefers-color-scheme: dark) { p:first-child { color: #58a6ff; } }
      h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0.5rem 0; }
      .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; margin-top: 2rem; }
      a { border: 2px solid #0550ae; border-radius: 0.375rem; color: #0550ae; font-weight: 700; padding: 0.8rem 1.2rem; text-decoration: none; }
      a:first-child { background: #0550ae; color: #f6f8fa; }
      @media (prefers-color-scheme: dark) { a { border-color: #58a6ff; color: #58a6ff; } a:first-child { background: #58a6ff; color: #0d1117; } }
      a:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>Página no encontrada</h1>
      <p>La dirección puede haber cambiado o no estar disponible.</p>
      <nav class="links" aria-label="Enlaces para continuar">
        <a href="/">Ir al inicio</a>
        <a href="/projects">Ver proyectos</a>
      </nav>
    </main>
  </body>
</html>
